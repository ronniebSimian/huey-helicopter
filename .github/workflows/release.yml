# Push a tag like v0.1.0 and this builds the mod and publishes a GitHub Release with the jar attached.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar')
          gh release create "${GITHUB_REF_NAME}" "$jar" --title "Huey Helicopter ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
